services:
  backend:
    build:
      context: ./backend
    container_name: ucaas-ccaas-backend
    environment:
      DATABASE_URL: sqlite:///./ucaas_ccaas.db
      SECRET_KEY: replace-me
      SUPPLIER_STATE_CODE: MH
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: ucaas-ccaas-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

